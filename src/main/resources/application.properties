spring.config.import=optional:file:/workspace/config/env/application.properties

spring.application.name=${APP_NAME:pdf-form-generator}
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:pdfdb}?serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

storage.path=${STORAGE_PATH:/workspace/storage}

pdf.security.user-password=${PDF_USER_PASSWORD:}
pdf.security.owner-password=${PDF_OWNER_PASSWORD:}
pdf.security.enabled=true
