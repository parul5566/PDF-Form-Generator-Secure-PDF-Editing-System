<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Generated</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:#f0f2f5; color:#1c2733; }
  .navbar { background:#1f3a5f; color:#fff; padding:14px 24px; display:flex; gap:28px; align-items:center; }
  .navbar .brand { font-weight:700; font-size:16px; }
  .navbar a { color:#cfe0f5; text-decoration:none; font-size:14px; }
  .container { max-width: 720px; margin: 48px auto; padding: 0 16px; }
  .card { background:#fff; border-radius:10px; padding:32px; box-shadow:0 2px 8px rgba(0,0,0,.08); text-align:center; }
  .ok { font-size:40px; }
  h1 { font-size:20px; }
  .ref { background:#eef5ff; border:1px solid #cfe0f5; border-radius:8px; padding:10px 16px; display:inline-block; margin:14px 0; font-weight:700; }
  .actions { display:flex; gap:12px; justify-content:center; margin-top:20px; }
  .btn { padding:11px 24px; border-radius:8px; text-decoration:none; font-size:14px; font-weight:600; }
  .btn-primary { background:#1f6feb; color:#fff; }
  .btn-secondary { background:#e7edf3; color:#1f3a5f; }
  .meta { color:#5a6b7d; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div class="navbar">
  <span class="brand">PDF Form Generator</span>
  <a href="/">Home</a>
  <a href="/form/new">New GSTR-3B</a>
  <a href="/documents">Document History</a>
  <a href="/upload">Upload PDF</a>
</div>
<div class="container">
  <div class="card">
    <div class="ok">&#9989;</div>
    <h1>PDF Generated Successfully</h1>
    <div class="ref">Reference: <span th:text="${reference}">REF</span></div>
    <div class="meta">
      Status: <span th:text="${doc.status}">READY</span> &nbsp;|&nbsp;
      Encryption: <span th:text="${doc.encryptionStatus}">NONE</span>
    </div>
    <div class="actions">
      <a class="btn btn-primary" th:href="@{/documents/{id}/download(id=${doc.id})}">Download PDF</a>
      <a class="btn btn-secondary" target="_blank" th:href="@{/documents/{id}/preview(id=${doc.id})}">Preview</a>
      <a class="btn btn-secondary" href="/documents">Document History</a>
    </div>
  </div>
</div>
</body>
</html>
